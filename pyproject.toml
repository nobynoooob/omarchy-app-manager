[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-app-manager"
version = "1.0.0"
authors = [
    {name = "Mostafa Hossam El-Din", email = "mostafa.hosayda@gmail.com"}
]
description = "A modern desktop application for managing AppImages and shortcuts"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
dependencies = [
    # Pinned to the exact version verified in requirements.txt (with its
    # recorded artifact hashes), so no dependency bytes are selected at
    # install time.
    "PyQt6==6.11.0",
]

[project.urls]
Homepage = "https://github.com/nobynoooob/omarchy-app-manager"

[project.scripts]
omarchy-app-manager = "omarchy_app_manager.__main__:main"
